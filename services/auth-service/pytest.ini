[pytest]
log_level = DEBUG
log_format = %(levelname)s %(name)s: %(message)s
addopts = -v --tb=short --capture=no
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
log_cli = true
log_cli_level = DEBUG
log_cli_format = %(message)s